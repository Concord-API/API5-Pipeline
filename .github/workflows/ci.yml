name: Pipeline CI

on:
  pull_request:
    branches: [main, 'us*']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pipeline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Run tests with coverage
        run: pytest --cov=pipeline --cov-branch --cov-report=xml:coverage.xml --junitxml=test-results/pytest.xml
      - name: Upload test results and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-test-results-${{ github.sha }}
          path: |
            coverage.xml
            test-results/
          retention-days: 14

  quality:
    name: Pipeline quality
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
      SONAR_WAIT_GATE: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Skip when SonarQube Cloud is not configured
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN is not available, the quality analysis was skipped"
      - name: Skip branches that the SonarQube Cloud plan does not analyze
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ENABLED != 'true' }}
        run: echo "Only pull requests and main are analyzed; this push is covered by its pull request analysis"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ env.SONAR_ENABLED == 'true' }}
        with:
          fetch-depth: 0
      - name: Download the test results and coverage
        if: ${{ env.SONAR_ENABLED == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pipeline-test-results-${{ github.sha }}
      - name: Send the analysis and wait for the quality gate
        if: ${{ env.SONAR_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ env.SONAR_WAIT_GATE }}
            -Dsonar.qualitygate.timeout=300
